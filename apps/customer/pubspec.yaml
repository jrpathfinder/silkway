name: silkway_app
description: Silkway customer and courier delivery app (Central Asia Restaurant, Moscow).
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Identifiers
  uuid: ^4.5.0

  # Localization
  intl: ^0.20.3

  # Payment checkout
  webview_flutter: ^4.9.0

  # Брендовый ролик-заставка при запуске (см. SplashScreen).
  # Нативная заставка ниже показать видео не может — только картинку,
  # поэтому ролик проигрывается уже средствами Flutter.
  video_player: ^2.14.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  flutter_native_splash: ^2.4.1
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/branding/dishes/

# ПЕРВАЯ (нативная) заставка — статичная картинка, которую ОС показывает,
# пока грузится движок Flutter. Видео здесь невозможно в принципе.
# splash.png — кадр из launch.mp4, а цвет фона совпадает с
# SplashScreen.backgroundColor, чтобы переход к видео был незаметным.
# После изменения этой секции нужно перегенерировать:
#   dart run flutter_native_splash:create
#
# Generated via `dart run flutter_native_splash:create`.
# Source: assets/branding/splash.png, a frame from the brand video
# (Чайхана Шёлковый Путь) — assets/branding/launch.mp4.
# TODO(design): source art is only 464x656 (low-res video export) — looks
# soft on high-DPI screens. Swap in a higher-resolution export when available.
flutter_native_splash:
  color: "#2A211A"
  image: assets/branding/splash.png
  fullscreen: true
  # Без этой строки imageView получает contentMode="center" и рисует картинку
  # в натуральном размере: пакет считает исходник за @4x и ужимает его вчетверо
  # (464x656 -> 348x492 px = 116x164 pt), из-за чего на экране появлялся
  # маленький прямоугольник по центру.
  #
  # scaleAspectFit растягивает на всю ширину, сохраняя пропорции — ровно так же
  # показывается и видео (BoxFit.contain в SplashScreen), поэтому переход
  # «нативная заставка -> видео» происходит без скачка размера.
  ios_content_mode: scaleAspectFit
  android_12:
    color: "#2A211A"
    image: assets/branding/splash.png
